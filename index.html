<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav class="nav">
        <div class="left">Kanban</div>
        <div class="right">
          <button id="add_btn">Add new task</button>
        </div>
      </nav>
      <section class="section">
        <div id="todo" class="column Todo">
          <nav class="main-nav">
            <div class="left">To Do</div>
            <div class="right">Count</div>
          </nav>
        </div>
        <div id="progress" class="column Progress">
          <nav class="main-nav">
            <div class="left">In Progress</div>
            <div class="right">Count</div>
          </nav>
        </div>
        <div id="done" class="column completed">
          <nav class="main-nav">
            <div class="left">Completed</div>
            <div class="right">Count</div>
          </nav>
        </div>
      </section>
    </main>
    <div class="styling-div" id="dabba">
      <div class="adjusting-div">
        <div>
          <input class="input" type="text" placeholder="Task Title"/>
        </div>
        <div>
          <input class="desc" type="text" placeholder="Task Description"/>
        </div>
        <button class="add-task">Add Task</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
